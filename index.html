  <!-- Force injection of the authentic Google reCAPTCHA v3 badge for our UI animation -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LfgSHgsAAAAAHlWl9ZRVO1IvJGsEkyj8_lYVF2i"></script>

  <style>
    /* Google reCAPTCHA v3 Badge Controls */
    .grecaptcha-badge {
      opacity: 0 !important;
      visibility: hidden !important;
      transform: translateY(20px) !important;
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s ease !important;
      bottom: 24px !important;
      /* Lift it up slightly to match the UI style */
    }

    /* When body has this class, smoothly reveal the badge */
    body.show-recaptcha .grecaptcha-badge {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translateY(0) !important;
    }
  </style>
